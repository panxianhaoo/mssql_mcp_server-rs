# Release：push 形如 v0.1.0 的 tag 时，三平台构建 release 二进制并发布 GitHub Release。
# 附件为可直接下载执行的裸二进制（按平台命名，不做压缩打包）。
# 发布流程：更新 Cargo.toml 的 version -> commit -> git tag v0.1.0 -> git push origin v0.1.0
#
# 结构：build（三平台并行构建并上传 artifact） -> release（单点发布）。
# release notes 只在 release job 生成一次，避免多份重复的 "Full Changelog"。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # x86_64 Linux（下载后需 chmod +x）
            target: linux-x86_64
          - os: windows-latest
            # x86_64 Windows（含 Windows 集成认证），exe 可直接运行
            target: windows-x86_64.exe
          - os: macos-latest
            # Apple Silicon macOS（下载后需 chmod +x）
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # 裸二进制按平台重命名，避免不同平台的同名文件在 Release 中冲突
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mv target/release/mssql_mcp_server-rs "mssql_mcp_server-rs-${{ matrix.target }}"

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv target/release/mssql_mcp_server-rs.exe "mssql_mcp_server-rs-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: mssql_mcp_server-rs-*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 下载全部平台产物并合并到 dist/ 目录
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 单点创建 Release 并上传所有二进制；notes 只生成一次
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
