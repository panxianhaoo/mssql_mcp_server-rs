# CI：三平台（Linux / Windows / macOS）上做格式检查、clippy 与单元测试。
# Windows runner 是重点——本地（macOS）无法交叉编译验证 #[cfg(windows)] 的
# 集成认证代码路径，只能靠这里的真实 Windows 环境编译并运行 Windows-only 测试。

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其他平台的结果收集。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
