# CI：三平台（Linux / Windows / macOS）做格式检查、clippy 与单元测试；
# 集成测试仅在 Linux 上运行——GitHub 的 macOS runner 不预装 Docker，
# Windows runner 的容器支持也不适合同跑 Linux 镜像；Linux 足以保证
# 「真实 SQL Server 上的行为」被覆盖。
#
# Windows runner 另有重点：本地（macOS）无法交叉编译验证 #[cfg(windows)] 的
# 集成认证代码路径，只能靠这里的真实 Windows 环境编译并运行 Windows-only 测试。

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其他平台的结果收集。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # `http` feature 依赖 axum/hyper，默认 feature 集不会编译到，
      # 必须单独跑一遍，否则改了 src/http.rs 也不会在 CI 上暴露。
      - name: Check (http feature)
        run: cargo clippy --all-targets --features http -- -D warnings

      - name: Test (http feature)
        run: cargo test --features http

  integration:
    name: Integration (SQL Server 2022)
    runs-on: ubuntu-latest
    env:
      # 与 docker-compose.yml 保持一致（后者的默认值）。
      MSSQL_SERVER: localhost
      MSSQL_PORT: 14333
      MSSQL_USER: sa
      MSSQL_PASSWORD: YourStrong!Passw0rd
      MSSQL_DATABASE: master
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --wait 会阻塞到 healthcheck 通过，避免 cargo test 抢跑在实例就绪之前。
      # 这里的 --wait 很重要：SQL Server 启动通常要约 20~30 秒。
      - name: Start SQL Server
        run: docker compose up -d --wait

      - name: Integration tests
        run: cargo test --test integration -- --ignored

      # 新增功能（视图定义/表规模/多库/输出格式）也在真实 Server 上验证。
      - name: Integration tests (http feature)
        run: cargo test --test integration --features http -- --ignored

      # 无论成败都清理，避免容器/数据卷残留占用 runner 资源。
      - name: Tear down SQL Server
        if: always()
        run: docker compose down -v
