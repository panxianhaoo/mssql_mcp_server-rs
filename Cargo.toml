[package]
name = "mssql_mcp_server-rs"
version = "0.3.0"
edition = "2024"
description = "MCP server for Microsoft SQL Server (Rust port of mssql_mcp_server)"
license = "MIT"

[dependencies]
anyhow = "1"
rmcp = { version = "3.5", features = ["transport-io"] }
# tiberius 锁定 0.12：与 bb8-tiberius 0.16 的依赖一致，避免引入两套驱动类型。
# 0.12 没有 tds80 feature（0.13 起才有），TDS 7.3 协商即可连接所有受支持的 SQL Server。
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
log = "0.4"
env_logger = "0.11"
bb8 = "0.9.1"
bb8-tiberius = "0.16.0"

# Windows 集成认证（SSPI）：仅 Windows 目标启用 winauth feature。
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["winauth"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# 集成测试用真正的 CSV 解析器校验输出，而不是靠肉眼比对字符串。
csv = "1"
