[package]
name = "mssql_mcp_server-rs"
version = "0.2.0"
edition = "2024"
description = "MCP server for Microsoft SQL Server (Rust port of mssql_mcp_server)"
license = "MIT"

[dependencies]
anyhow = "1"
rmcp = { version = "3.5", features = ["transport-io"] }
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
log = "0.4"
env_logger = "0.11"

# Windows 集成认证（SSPI）：仅 Windows 目标启用 winauth feature。
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
