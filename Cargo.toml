[package]
name = "mssql_mcp_server-rs"
version = "0.5.0"
edition = "2024"
description = "MCP server for Microsoft SQL Server (Rust port of mssql_mcp_server)"
license = "MIT"

[dependencies]
anyhow = "1"
rmcp = { version = "3.5", features = ["transport-io"] }
# tiberius 用 0.13 而非 bb8-tiberius 锁定的 0.12：0.12 在解析
# sql_variant / geography / hierarchyid 等 UDT 列的元数据时会 `todo!()` panic，
# 查询这类列会直接挂住整个请求（见 src/pool.rs 的模块说明）。
# 0.13 已实现 UDT 解码，故此处自行实现 bb8 的 ManageConnection，
# 不再依赖尚未跟上 0.13 的 bb8-tiberius。
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
bb8 = "0.9.1"

# HTTP 传输（streamable-http）为可选特性：默认只提供 stdio，避免为不需要
# 远程部署的用户引入 axum/hyper 依赖树。
axum = { version = "0.8", optional = true }

[features]
default = []
# 启用后可用 MSSQL_TRANSPORT=http 通过 HTTP 提供 MCP（默认 stdio）。
http = ["dep:axum", "rmcp/transport-streamable-http-server"]

# Windows 集成认证（SSPI）：仅 Windows 目标启用 winauth feature。
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# 集成测试用真正的 CSV 解析器校验输出，而不是靠肉眼比对字符串。
csv = "1"
